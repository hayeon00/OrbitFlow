apiVersion: v1
kind: Service
metadata:
  name: chromadb
spec:
  selector:
    app: chromadb
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.4.21
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            # chromadb 0.4.x 는 IS_PERSISTENT / PERSIST_DIRECTORY 를 읽는다.
            # (CHROMA_PERSIST_DIRECTORY 는 인식되지 않아 메모리 모드로 동작 → 재시작 시 모든 벡터 유실)
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: /chroma/data
            - name: ANONYMIZED_TELEMETRY
              value: "FALSE"

          command: [ "uvicorn" ]
          args:
            - "chromadb.app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/data

      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: chromadb-pvc
